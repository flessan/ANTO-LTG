name: Validate catalogs and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - run: npm run build
      - name: Test generated SEO files
        run: |
          SITE_URL=https://anto-ltg-ci.invalid npm run build
          python -c "import xml.etree.ElementTree as E; E.parse('sitemap.xml'); E.parse('feed.xml'); print('Generated XML is valid')"
